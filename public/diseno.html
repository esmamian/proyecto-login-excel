<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuestionario Diseño</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="contenedor">

  <h1>Diseño</h1>
  <h2 id="bienvenida"></h2>
  <form id="formulariodiseno">

<button type="button" class="button1" onclick="window.location.href='principal.html'">
  Volver al menú
</button>
  
 <!-- ITEM 1 -->

<div class="item">
  <div class="fila">

    <div class="texto">
      Obra de creación en diseño o comunicación visual
    </div>

    <div id="Obra" class="cantidad">
      <label>¿Cuántos internacional?</label>
      <input type="number" min="0" step="1" id="numobrainternacional" name="numobrainternacional" placeholder="0">

      <label>¿Cuántas nacional?</label>
      <input type="number" min="0" step="1" id="numobranacional" name="numobranacional" placeholder="0">
      
      <label>¿Cuántas regional/local?</label>
      <input type="number" min="0" step="1" id="numobralocal" name="numobralocal" placeholder="0">
      
    </div>

    <div class="opciones">
      <label>
        <input type="radio" name="Expindividual" value="Sí" onclick="mostrarCantidad('Expindividual')">
        Sí
      </label>

      <label>
        <input type="radio" name="Expindividual" value="No" onclick="ocultarCantidad('Expindividual')">
        No
      </label>
    </div>

  </div>
</div>


 <!-- ITEM 2 -->

<div class="item">
  <div class="fila">

    <div class="texto">
      Obra premiada en concurso o salones
    </div>

    <div id="obra" class="cantidad">
      <label>¿Cuántos internacional?</label>
      <input type="number" min="0" step="1" id="numobrainter" name="numobrainter" placeholder="0">

      <label>¿Cuántas nacional?</label>
      <input type="number" min="0" step="1" id="numobranal" name="numobranal" placeholder="0">
      
    </div>

    <div class="opciones">
      <label>
        <input type="radio" name="curartisticas" value="Sí" onclick="mostrarCantidad('curartisticas')">
        Sí
      </label>

      <label>
        <input type="radio" name="curartisticas" value="No" onclick="ocultarCantidad('curartisticas')">
        No
      </label>
    </div>

  </div>
</div>



  <button type="button" class="button1" onclick="window.location.href='principal.html'">
  Volver al menú
</button>  

  <button type="submit" class="button1">
    Guardar respuestas
  </button>

  <p id="mensaje"></p>

  </form>
</div>

<script>
let usuarioActual = null;

async function cargarUsuario() {
  const res = await fetch("/usuario");

  if (!res.ok) {
    window.location.href = "index.html";
    return;
  }

  usuarioActual = await res.json();

  document.getElementById("bienvenida").textContent =
    "Usuario: " + usuarioActual.usuario;
}

cargarUsuario();

function mostrarCantidad(id) {
  document.getElementById(id).style.display = "block";
}

function ocultarCantidad(id) {
  const contenedor = document.getElementById(id);

  contenedor.style.display = "none";

  const inputs = contenedor.querySelectorAll("input");

  inputs.forEach(input => {
    input.value = "";
  });
}


</script>

</body>
</html>
