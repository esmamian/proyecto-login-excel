<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuestionario ASPU - Universidad del Cauca</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="contenedor">
  <h1>Menú principal</h1>
  <h2 id="bienvenida"></h2>

  <div class="menu">
    <a href="formacionacademica.html">1.1 Formación Académica</a>
    <a href="Experiencia.html">1.2 Experiencia</a>
    <a href="Productividad.html">1.3 Productividad Académica</a>
    <a href="ProductividadArtistica.html">1.4 Productividad Artística (si aplica)</a>
  </div>

  <div class="button1">
  <button onclick="logout()">Cerrar sesión</button>
  </div>
  
<button id="btnExcel" style="display:none;" onclick="descargarExcel()">Descargar Excel </button>

</div>

  
<script>
let usuarioActual = null;

async function cargarUsuario() {
  const res = await fetch("/usuario");

  if (!res.ok) {
    window.location.href = "index.html";
    return;
  }

  usuarioActual = await res.json();

  document.getElementById("bienvenida").textContent =
    "Usuario: " + usuarioActual.usuario;

  if (usuarioActual.rol === "admin") {
    document.getElementById("btnExcel").style.display = "inline-block";
  }
}

function descargarExcel() {
  window.location.href = "/descargar-excel";
}
  
  async function logout() {
  await fetch("/logout", { method: "POST" });
  window.location.href = "index.html";
}

cargarUsuario();

</script>
</body>
</html>
