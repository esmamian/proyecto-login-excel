<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuestionario</title>
</head>
<body>

<h1>Cuestionario</h1>
<h2 id="bienvenida"></h2>

<form id="formulario">

  <p>¿Tiene doctorado?</p>
  <label><input type="radio" name="doctorado" value="Sí" required> Sí</label>
  <label><input type="radio" name="doctorado" value="No"> No</label>

  <p>¿Tiene maestría?</p>
  <label><input type="radio" name="maestria" value="Sí" required> Sí</label>
  <label><input type="radio" name="maestria" value="No"> No</label>

  <p>¿Tiene curso de inglés?</p>
  <label><input type="radio" name="ingles" value="Sí" required> Sí</label>
  <label><input type="radio" name="ingles" value="No"> No</label>

  <br><br>
  <button type="submit">Guardar respuestas</button>

</form>

<br>

<button id="btnExcel" style="display:none;" onclick="descargarExcel()">
  Descargar Excel
</button>

<br><br>

<button onclick="logout()">Cerrar sesión</button>

<p id="mensaje"></p>

<script>
let usuarioActual = null;

async function cargarUsuario() {
  const res = await fetch("/usuario");

  if (!res.ok) {
    window.location.href = "index.html";
    return;
  }

  usuarioActual = await res.json();

  document.getElementById("bienvenida").textContent =
    "Usuario: " + usuarioActual.usuario;

  if (usuarioActual.rol === "admin") {
    document.getElementById("btnExcel").style.display = "inline-block";
  }
}

document.getElementById("formulario").addEventListener("submit", async function(e) {
  e.preventDefault();

  const datos = new FormData(this);

  const res = await fetch("/guardar-respuestas", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      doctorado: datos.get("doctorado"),
      maestria: datos.get("maestria"),
      ingles: datos.get("ingles")
    })
  });

  const data = await res.json();

  document.getElementById("mensaje").textContent = data.mensaje;
});

function descargarExcel() {
  window.location.href = "/descargar-excel";
}

async function logout() {
  await fetch("/logout", { method: "POST" });
  window.location.href = "index.html";
}

cargarUsuario();
</script>

</body>
</html>
